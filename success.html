<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ordine in pista — SPEEDSOCKS</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏁</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500&family=IBM+Plex+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--asphalt:#0a0a0b;--volt:#d6ff3a;--bone:#f2f0e9;--dim:#93939b;--line:#232328;--panel:#141417}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--asphalt);color:var(--bone);font-family:'Archivo',sans-serif;min-height:100svh;display:grid;place-items:center;overflow:hidden}
  .flag{position:fixed;inset:-20% -40%;opacity:.25;pointer-events:none;
    background:repeating-linear-gradient(115deg,transparent 0 140px,rgba(214,255,58,.07) 140px 143px,transparent 143px 260px,rgba(242,240,233,.05) 260px 262px);
    animation:drift 22s linear infinite}
  @keyframes drift{to{transform:translateX(-320px)}}
  .box{text-align:center;padding:40px;position:relative;z-index:1;animation:pop .6s cubic-bezier(.2,.9,.3,1.3) both}
  @keyframes pop{from{opacity:0;transform:translateY(30px) scale(.96)}}
  .emoji{font-size:64px}
  h1{font-family:'Anton',sans-serif;font-weight:400;font-size:clamp(48px,8vw,92px);text-transform:uppercase;transform:skewX(-6deg);line-height:.95;margin:24px 0 16px}
  h1 b{color:var(--volt);font-weight:400}
  p{color:var(--dim);font-size:17px;line-height:1.7;max-width:44ch;margin:0 auto}
  .code{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.15em;color:var(--volt);border:1px dashed var(--line);border-radius:99px;padding:10px 18px;display:inline-block;margin-top:26px;background:var(--panel)}
  a.back{display:inline-flex;gap:10px;margin-top:34px;font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase;background:var(--volt);color:#0a0a0b;text-decoration:none;padding:16px 26px;border-radius:12px;transition:transform .18s ease}
  a.back:hover{transform:translateY(-2px)}
</style>
</head>
<body>
<div class="flag" aria-hidden="true"></div>
<main class="box">
  <div class="emoji">🏁</div>
  <h1>Ordine<br><b>in pista.</b></h1>
  <p>Grazie! Il pagamento di prova è andato a buon fine. I tuoi SpeedSocks Pro (immaginari) sono già in fase di riscaldamento: spedizione simulata in 24 h.</p>
  <span class="code">TEST MODE · NESSUN ADDEBITO REALE</span><br>
  <a class="back" href="./">← Torna in griglia di partenza</a>
</main>
</body>
</html>
